# docker-compose.yml — FieldOps 本地开发环境
# 启动：docker compose up -d（默认值与 .env.local 一致，亦可 --env-file .env.local 覆盖）

services:

  # ── PostgreSQL 主数据库（对外 5433，本机 5432 已占用）──
  postgres:
    image: postgres:15-alpine
    container_name: fieldops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fieldops}
      POSTGRES_USER: ${DB_USER:-fieldops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 容器首次启动时自动执行建表脚本
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fieldops_user} -d ${DB_NAME:-fieldops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 缓存（对外 6380，本机 6379 已占用）──
  redis:
    image: redis:7-alpine
    container_name: fieldops_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── etcd（Milvus 元数据存储，仅内部使用，不对外暴露端口）──
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: fieldops_etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd

  # ── MinIO（Milvus 向量文件存储，对外 9002/9003）──
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fieldops_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000"    # API 端口
      - "9003:9001"    # 控制台端口
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Milvus 向量数据库（对外 19531，本机 19530 已占用）──
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: fieldops_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19531:19530"
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10

# ── 数据卷（持久化，重启容器数据不丢失）──
volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
