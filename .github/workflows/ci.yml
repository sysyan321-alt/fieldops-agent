name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支连推多次时，取消排队中的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"        # 硬要求：LangGraph interrupt() 在 3.10 上不可用
          cache: pip

      # 先做环境自检：Docker 不可用、compose 文件写坏，都在这里一眼可见，
      # 而不是等到后面的步骤抛一句看不出所以然的话
      - name: 环境自检
        run: |
          docker version
          docker compose version
          docker compose config --quiet

      # 测试配置：口令与 Key 都用占位值，仓库里不放任何真实凭据
      - name: 准备测试配置
        run: |
          cat > .env.local <<'EOF'
          DB_HOST=127.0.0.1
          DB_PORT=5433
          DB_NAME=fieldops
          DB_USER=fieldops_user
          DB_PASSWORD=ci-test-password
          JWT_SECRET_KEY=ci-test-jwt-secret
          DEEPSEEK_API_KEY=sk-your-key-here
          QWEN_API_KEY=
          DEFAULT_LLM_PROVIDER=deepseek
          MILVUS_HOST=127.0.0.1
          MILVUS_PORT=19531
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6380
          SEED_DEMO_USERS=true
          MCP_ENABLED=false
          CORS_ORIGINS=
          EOF
          # 用这份配置再解析一次 compose 文件，确认占位值不会把插值搞崩
          docker compose --env-file .env.local config --quiet

      # 只起测试真正依赖的服务。用例对基础设施的依赖是：
      #   PostgreSQL —— db_ready 夹具，连不上自动 skip
      #   Redis      —— 缓存用例，连不上自动 skip
      # Milvus / etcd / minio 不参与任何用例（向量链路由 scripts/ 下的脚本单独验证），
      # 所以 CI 不拉这几个 GB 级镜像：既省时间，也避免镜像源波动把整条流水线拖红。
      # 失败时把最后几行错误顶成 annotation，Actions 页面上直接能看到原因。
      - name: 起基础设施（postgres / redis）
        run: |
          up() { docker compose --env-file .env.local up -d --wait postgres redis; }
          up || { echo "第一次启动失败，10 秒后重试"; sleep 10; up; } || {
            detail=$(docker compose --env-file .env.local up -d --wait postgres redis 2>&1 | tail -5 | tr '\n' ' ')
            echo "::error title=基础设施启动失败::${detail:0:400}"
            docker compose ps || true
            exit 1
          }
          docker compose ps

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # CI 里不做真实推理（缺权重时相关用例自动跳过），装带 CUDA 依赖的 torch 是纯浪费：
          # 先装 CPU 轮子（约 200MB，而 PyPI 默认轮子拖着一堆 CUDA 依赖，约 1GB）
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5.0" \
            || echo "（CPU 版 torch 预装失败，回落到 PyPI 默认源）"
          # 全量安装：reranker.py / knowledge_base.py 在模块层 import torch 与 transformers，
          # 缺了会直接 ImportError。**模型权重本身不下载**——用例已做到不依赖权重
          # （需要权重的用例用 conftest 的 models_ready 夹具跳过）。
          pip install -r requirements.txt

      # 全新库冒烟：在空库上跑一遍建表脚本 + 启动迁移。
      # 本机的数据卷早就初始化过，"建表脚本与启动迁移漂移"只会在新克隆的环境里炸
      # （真实踩过：建表脚本给一张只存在于启动迁移里的表建索引 → postgres 容器 exit=3）。
      - name: 全新库初始化冒烟检查
        run: python scripts/check_fresh_db.py

      - name: 跑测试
        run: python -m pytest tests/ -q

      - name: 依赖版本快照（排查用）
        if: always()
        run: pip freeze > /tmp/pip-freeze.txt && tail -20 /tmp/pip-freeze.txt

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build
